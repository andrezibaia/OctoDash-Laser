<div class="lz-screen" (click)="reconnect()">
  <div class="lz-screen__canvas standby-lz">
    <div class="standby-lz__dot" [class.standby-lz__dot--busy]="connecting"></div>
    @if (!connecting) {
      <div class="standby-lz__big">{{ 'Em repouso' | lzt }}</div>
      <div class="standby-lz__small">{{ 'Toque no ecrã para acordar.' | lzt }}</div>
    }
    @if (connecting) {
      <div class="standby-lz__big loading-dots">{{ 'A ligar' | lzt }}</div>
      @if (showConnectionError) {
        <div class="standby-lz__small">
          {{ 'Não foi possível ligar ao OctoPrint. Toque para tentar de novo.' | lzt }}
        </div>
      }
    }
  </div>
</div>
